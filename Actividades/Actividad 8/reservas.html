<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Retiro Sustentable</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="header-sitio">
        <a href="index.html" class="enlace-logo">
            <img src="imagen/logo.png" alt="Logotipo de Retiro Sustentable - Estudio Copan Arquitectura" class="logo-img">
        </a>
        <nav class="nav-principal">
            <ul class="lista-nav">
                <li><a href="index.html" class="enlace-nav">Inicio / Cabañas</a></li>
                <li><a href="reservas.html" class="enlace-nav activo">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-sitio">

        <section class="seccion-formulario">
            <h1 class="titulo-principal">Solicitud de Reserva</h1>
            <p class="bajada-hero">Completá el formulario a continuación para consultar disponibilidad y realizar tu reserva en San Javier.</p>

            <!-- Formulario completo con los atributos action y method -->
            <form action="#" method="post" class="formulario-reserva">

                <div class="campo-form"> <!--'for', 'id' para accesibilidad de formularios -->
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana Pérez">
                </div>

                <div class="campo-form">
                    <label for="telefono">Teléfono de contacto:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej. +54 351 1234567">
                </div>

                <div class="campo-form">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="campo-form">
                    <label for="fecha_desde">Fecha desde (Check-in):</label>
                    <input type="date" id="fecha_desde" name="fecha_desde" required>
                </div>

                <div class="campo-form">
                    <label for="fecha_hasta">Fecha hasta (Check-out):</label>
                    <input type="date" id="fecha_hasta" name="fecha_hasta" required>
                </div>

                <div class="campo-form">
                    <label for="comentario">Comentario o consulta adicional:</label>
                    <textarea id="comentario" name="comentario" rows="5" placeholder="Indicános cuál cabaña preferís o si tenés alguna duda particular..."></textarea>
                </div>

                <button type="submit" class="boton-enviar">Enviar Consulta de Reserva</button>

            </form>
        </section>

    </main>

    <footer class="footer-sitio">
        <p>&copy; 2026 Retiro Sustentable - Estudio Copan Arquitectura. San Javier, Traslasierra, Córdoba.</p>
    </footer>

</body>
</html>
