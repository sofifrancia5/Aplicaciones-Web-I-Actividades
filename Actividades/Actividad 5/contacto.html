<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Marina Ferretti</title>
</head>
<body>

    <!-- Menú de navegación básico entre las 2 páginas -->
    <nav>
        <a href="index.html">Quién soy / Servicios</a> | 
        <a href="contacto.html">Contacto</a>
    </nav>

    <hr>

    <!-- Título y texto introductorio -->
    <h1>Contacto</h1>

    <p>Si querés dar el primer paso hacia un cambio en tu alimentación, completá el siguiente formulario y me pondré en contacto con vos a la brevedad para coordinar tu primera consulta.</p>

    <!-- Formulario de Contacto -->
    <form action="#" method="post">
        
        <p>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </p>

        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="telefono">Teléfono de contacto:</label><br>
            <input type="tel" id="telefono" name="telefono">
        </p>

        <p>
            <label for="motivo">Motivo de consulta:</label><br>
            <select id="motivo" name="motivo">
                <option value="bajar_peso">Bajar de peso</option>
                <option value="control_salud">Control de colesterol/diabetes</option>
                <option value="nutricion_deportiva">Nutrición deportiva</option>
                <option value="otro">Otro</option>
            </select>
        </p>

        <p>
            <label for="horario">Horario preferido de contacto:</label><br>
            <select id="horario" name="horario">
                <option value="manana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>
        </p>

        <p>
            <label for="comentarios">Comentarios adicionales:</label><br>
            <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar consulta">
        </p>

    </form>

</body>
</html>
